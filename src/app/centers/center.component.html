<p-breadcrumb
  class="max-w-full"
  styleClass="mb-3"
  [model]="items"
  [home]="home"
></p-breadcrumb>
<div class="card">
  <p-table
    #dt
    [value]="paging.data"
    [rows]="paging.pageSize"
    [lazy]="true"
    [paginator]="true"
    [first]="paging.currentStartIndex"
    [totalRecords]="paging.totalItems"
    (onPage)="onPageChange($event)"
    [rowHover]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{{ 'public.showing' | translate }} {{
      paging.currentStartIndex
    }} {{ 'public.to' | translate }} {{ paging.currentEndIndex }} {{
      'public.of' | translate
    }} {{ paging.totalItems }} {{ 'public.rows' | translate }}"
    [rowsPerPageOptions]="[5, 10, 25, 50, 100]"
    dataKey="id"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template pTemplate="caption">
      <div class="flex">
        <button
          pButton
          [label]="'public.new' | translate"
          class="p-button-outlined"
          icon="pi pi-plus"
          *ngIf="permission.isCreated"
          [routerLink]="rout.centersCreate"
        ></button>
        <span class="p-input-icon-left ml-auto">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (keyup)="filterUpdate($event)"
            [placeholder]="'service.search' | translate"
          />
        </span>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>{{ "center.name" | translate }}</th>
        <th>{{ "center.phone" | translate }}</th>
        <th>{{ "center.status" | translate }}</th>
        <!-- <th>address</th> -->
        <!-- <th>{{ "public.phoneNumber" | translate }}</th> -->

        <th style="width: 12rem; text-align: center">
          {{ "center.actions" | translate }}
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-center>
      <tr>
        <td>{{ center.name }}</td>
        <td>{{ center.phone }}</td>

        <td>
          <p-tag
            [value]="status.getStatusName(center.status) | translate"
            [icon]="status.getStatusIcon(center.status)"
            [severity]="status.getStatusStyle(center.status)"
          ></p-tag>
        </td>
        <td>
          <div class="text-center">
            <p-button
              icon="pi pi-info"
              *ngIf="permission.isDetail"
              [routerLink]="rout.centersDetails + center.id"
              class="p-button-rounded p-button-success"
            ></p-button>

            <p-button
              icon="pi pi-pencil"
              *ngIf="permission.isUpdated"
              [routerLink]="rout.centersUpdate + center.id"
              class="p-button-rounded p-button-success mx-1"
            ></p-button>

            <p-button
              icon="pi pi-trash"
              *ngIf="permission.isDeleted"
              class="p-button-rounded p-button-success"
              severity="danger"
              (click)="deleteBtn(center.id)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
