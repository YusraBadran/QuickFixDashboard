<div class="grid p-fluid">
  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{ "service.name" | translate }}</label>
      <input
        pInputText
        id="name"
        #name="ngModel"
        [(ngModel)]="categoriesItem.name"
        [disabled]="true"
      />
    </div>
  </div>

  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{ "categories.name" | translate }}</label>
      <input
        pInputText
        id="name"
        #name="ngModel"
        [(ngModel)]="categoriesItem.category.name"
        [disabled]="true"
      />
    </div>
  </div>

  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{ "public.status" | translate }}</label>
      <input pInputText [(ngModel)]="state" [disabled]="true" />
      <!-- <p-dropdown></p-dropdown> -->
      <!-- [options]="states"
        [(ngModel)]="state" -->
    </div>
  </div>

  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{
        "categoriesItem.price" | translate
      }}</label>
      <input
        pInputText
        id="price"
        #price="ngModel"
        [(ngModel)]="categoriesItem.price"
        disabled="true"
      />
    </div>
  </div>

  <div class="col-12 m-1">
    <div class="flex flex-column"></div>
  </div>
  <div class="col-12">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{
        "public.description" | translate
      }}</label>

      <textarea
        pInputTextarea
        id="description"
        #description="ngModel"
        [(ngModel)]="categoriesItem.description"
        disabled="true"
      ></textarea>
    </div>
  </div>

  <div class="col-12">
    <div class="flex flex-wrap gap-2 mt-3 mb-2 justify-content-end">
      <p-button
        severity="danger"
        [label]="'public.cancel' | translate"
        (onClick)="closePopup()"
      ></p-button>
    </div>
  </div>
</div>
