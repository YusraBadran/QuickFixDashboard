<div class="card">
  <p-table
    #dt
    [value]="paging.data"
    [rows]="paging.pageSize"
    [lazy]="true"
    [paginator]="true"
    [first]="paging.currentStartIndex"
    [totalRecords]="paging.totalItems"
    (onPage)="onPageChange($event)"
    [rowHover]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{{ 'public.showing' | translate }} {{
      paging.currentStartIndex
    }} {{ 'public.to' | translate }} {{ paging.currentEndIndex }} {{
      'public.of' | translate
    }} {{ paging.totalItems }} {{ 'public.rows' | translate }}"
    [rowsPerPageOptions]="[5, 10, 25, 50, 100]"
    dataKey="id"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template pTemplate="caption">
      <div class="flex">
        <button
          pButton
          [label]="'public.new' | translate"
          class="p-button-outlined"
          icon="pi pi-plus"
          (click)="openCreateCategoriesItemPopup()"
        ></button>
        <span class="p-input-icon-left ml-auto">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (keyup)="filterUpdate($event)"
            [placeholder]="'service.search' | translate"
          />
        </span>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>{{ "service.img" | translate }}</th>
        <th>{{ "service.name" | translate }}</th>
        <th>{{ "categoriesItem.price" | translate }}</th>
        <th>{{ "service.status" | translate }}</th>
        <th style="width: 12rem; text-align: center">
          {{ "service.actions" | translate }}
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-categoryItem>
      <tr>
        <td>
          <p-avatarGroup styleClass="mb-3">
            <p-avatar
              *ngFor="let item of categoryItem.image"
              [image]="imageUrlApi.serverUrl + '/' + item.url"
              size="large"
              shape="circle"
            ></p-avatar>
          </p-avatarGroup>
          <img
            [src]="
              categoryItem.logo
                ? imageUrlApi.serverUrl + '/' + categoryItem.logo
                : ''
            "
            alt=""
            srcset=""
            width="60"
          />
        </td>
        <td>{{ categoryItem.name }}</td>
        <td>{{ categoryItem.price }}</td>
        <td>
          <p-tag
            [value]="status.getStatusName(categoryItem.status) | translate"
            [icon]="status.getStatusIcon(categoryItem.status)"
            [severity]="status.getStatusStyle(categoryItem.status)"
          ></p-tag>
        </td>
        <td>
          <div class="text-center">
            <p-button
              icon="pi pi-info"
              class="p-button-rounded p-button-success"
              (click)="openDetailsCategoriesItemPopup(categoryItem.id)"
            ></p-button>
            <p-button
              icon="pi pi-pencil"
              (click)="openUpdateCategoriesItemPopup(categoryItem.id)"
              class="p-button-rounded p-button-success mx-1"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              severity="danger"
              class="p-button-rounded p-button-success"
              (click)="deleteBtn(categoryItem.id)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
