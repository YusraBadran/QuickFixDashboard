<div class="card">
  <p-table
    #dt
    [value]="paging.data"
    [rows]="paging.pageSize"
    [lazy]="true"
    [paginator]="true"
    [first]="paging.currentStartIndex"
    [totalRecords]="paging.totalItems"
    (onPage)="onPageChange($event)"
    [rowHover]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{{ 'public.showing' | translate }} {{
      paging.currentStartIndex
    }} {{ 'public.to' | translate }} {{ paging.currentEndIndex }} {{
      'public.of' | translate
    }} {{ paging.totalItems }} {{ 'public.rows' | translate }}"
    [rowsPerPageOptions]="[5, 10, 25, 50, 100]"
    dataKey="id"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template pTemplate="caption">
      <div class="flex">
        <span class="p-input-icon-left ml-auto">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            (keyup)="filterUpdate($event)"
            [placeholder]="'service.search' | translate"
          />
        </span>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <!-- <th>{{ "service.img" | translate }}</th> -->
        <th>fisrtname</th>
        <th>lastname</th>
        <th>username</th>
        <th>email</th>
        <th>phoneNumber</th>
        <th>lastLoggedInAt</th>
        <th>userState</th>
        <th>createdAt</th>
        <th>roles</th>
        <!-- <th style="width: 12rem; text-align: center">
          {{ "service.actions" | translate }}
        </th> -->
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-users>
      <tr>
        <td>{{ users.firstName }}</td>
        <td>{{ users.lastName }}</td>
        <td>{{ users.userName }}</td>
        <td>{{ users.email }}</td>
        <td>{{ users.phoneNumber }}</td>
        <td>{{ users.lastLoggedInAt }}</td>
        <td>{{ users.userState }}</td>
        <td>{{ users.createdAt }}</td>
        <td>{{ users.roles }}</td>
        <td>
          <!-- <div class="text-center">
            <p-button
              icon="pi pi-info"
              class="p-button-rounded p-button-success"
            ></p-button>
             (click)="openDetailsServicesTypePopup(service.id)"
            <p-button
              icon="pi pi-pencil"
              class="p-button-rounded p-button-success mx-1"
            ></p-button>
            <!-- (click)="openUpdateServicesTypePopup(service.id)"
            <p-button
              icon="pi pi-trash"
              class="p-button-rounded p-button-success"
            ></p-button>
            <!-- (click)="deleteBtn(service.id)"
          </div> -->
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
