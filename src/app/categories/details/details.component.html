<div class="grid p-fluid">
  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{ "service.name" | translate }}</label>
      <div class="border-1 border-round h-3rem pt-2 border-blue-200">
        <span class="text-800 ml-3">{{ categories.name }}</span>
      </div>
    </div>
  </div>

  <div class="col-6" *ngIf="categories.subCategory">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{
        "categories.subCategory" | translate
      }}</label>
      <div class="border-1 border-round h-3rem pt-2 border-blue-200">
        <span class="text-800 ml-3">{{ categories.subCategory.name }}</span>
      </div>
    </div>
  </div>
  <div class="col-6" *ngIf="categories.serviceType">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{
        "menu.service.title" | translate
      }}</label>
      <div class="border-1 border-round h-3rem pt-2 border-blue-200">
        <span class="text-800 ml-3">{{ categories.serviceType.name }}</span>
      </div>
    </div>
  </div>
  <div class="col-6">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{ "public.status" | translate }}</label>
      <div class="border-1 border-round h-3rem pt-2 border-blue-200">
        <span class="text-800 ml-3">{{ state }}</span>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="flex flex-column">
      <label class="font-bold mb-2">{{
        "public.description" | translate
      }}</label>
      <div class="border-1 border-round h-7rem pt-2 border-blue-200">
        <span class="text-800 ml-3">{{ categories.description }}</span>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="flex flex-wrap gap-2 mt-3 mb-2 justify-content-end">
      <p-button
        severity="danger"
        [label]="'public.cancel' | translate"
        (onClick)="closePopup()"
      ></p-button>
    </div>
  </div>
</div>
