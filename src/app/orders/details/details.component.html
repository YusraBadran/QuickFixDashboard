<!-- <p-breadcrumb class="max-w-full " styleClass="mb-3" [model]="items" [home]="home"></p-breadcrumb> -->
<p-breadcrumb
  class="max-w-full"
  styleClass="mb-3"
  [model]="items"
  [home]="home"
></p-breadcrumb>

<!-- mid card -->
<div class="col-12 flex inline-flex bg-white">
  <!-- 1 -->
  <div class="col-6 flex flex-column">
    <label class="font-bold">Customer Details</label>
    <div class="flex inline-flex">
      <label class="mt-2">Full Name : </label>
      <span class="ml-2 p-0 mt-2">{{ order.user.fullName }}</span>
    </div>
    <div class="flex inline-flex">
      <label class="mt-2">Email :</label>
      <span class="ml-2 p-0 mt-2">{{ order.user.email }}</span>
    </div>
    <div class="flex inline-flex">
      <label class="mt-2">Phone :</label>
      <span class="ml-2 p-0 mt-2">{{ order.phone }}</span>
    </div>
  </div>

  <!-- 2 -->
  <div class="col-6 flex flex-column">
    <label class="font-bold">Order Details</label>

    <div class="flex inline-flex">
      <label class="mt-1">Order Status :</label>
      <span class="ml-2 p-0 mt-1">{{ order.status }}</span>
    </div>

    <div class="flex inline-flex">
      <label class="mt-2">Order Number : </label>
      <span class="ml-2 p-0 mt-2">{{ order.orderNumber }}</span>
    </div>

    <div class="flex inline-flex">
      <label class="mt-1">Location:</label>
      <span class="ml-2 p-0 mt-1">{{ order.address.location }}</span>
    </div>

    <div class="flex inline-flex">
      <label class="mt-1">date:</label>
      <span class="ml-2 p-0 mt-1">{{ order.date }}</span>
    </div>
  </div>
</div>

<!-- table -->
<div class="card mt-3">
  <p-table #dt [value]="order.orderDetails">
    <ng-template pTemplate="header">
      <tr>
        <th>name</th>
        <th>category</th>
        <th>price</th>
        <th>note</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-order>
      <tr>
        <td>{{ order.name }}</td>
        <td>{{ order.category }}</td>
        <td>{{ order.price }}</td>
        <td>{{ order.note }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="flex justify-content-end flex-wrap">
  <div class="bg-primary h-3rem w-2 pt-2 pl-3 mt-3">
    <label class="">Total</label>
    <span class="ml-3">{{ order.totalPrice }}</span>

      pInputText

      placeholder="Small"
      disabled="true"
    /> -->
  </div>
</div>
